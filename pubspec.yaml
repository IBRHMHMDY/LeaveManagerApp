name: leave_manager
description: "Leave Manager App - مدير اجازاتى - تتبع إجازاتك بذكاء وسهولة."
publish_to: 'none'
version: 1.4.0+7 # previous Release: 1.3.0+6

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.3          
  equatable: ^2.0.5             
  dartz: ^0.10.1                
  get_it: ^7.6.4                
  shared_preferences: ^2.3.0  
  drift: ^2.14.1                
  sqlite3_flutter_libs: ^0.5.18 
  path_provider: ^2.1.1         
  path: ^1.8.3                  
  intl: ^0.20.2                 
  google_fonts: ^6.2.0          
  flutter_localizations:        
    sdk: flutter
  share_plus: ^10.0.0           
  go_router: ^17.3.0
  package_info_plus: ^8.0.0     
  url_launcher: ^6.3.0          
  shimmer: ^3.0.0               
  injectable: ^2.6.0
  calendar_date_picker2: ^3.0.0
  cupertino_icons: ^1.0.8
  flutter_local_notifications: ^22.3.0 
  timezone: ^0.11.1
  permission_handler: ^13.0.1   
  google_sign_in: ^6.2.0        
  googleapis: ^13.1.0           
  googleapis_auth: ^1.4.1       
  file_picker: ^8.0.0           
  http: ^1.6.0
  connectivity_plus: ^7.3.1
  flutter_timezone: ^5.1.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.7           # المحرك الأساسي لتوليد الأكواد
  drift_dev: ^2.14.1             # لتوليد ملفات قاعدة البيانات الخاصة بـ Drift (ملفات .g.dart)
  injectable_generator: ^2.6.0
  flutter_lints: ^3.0.1           # قواعد تحليل الكود القياسية للحفاظ على نظافة الكود
  flutter_native_splash: ^2.4.7   # لتسريع عرض الشاشه الاساسيه عند بدء التطبيق
  change_app_package_name: ^1.5.0 # تغيير اسم المكتبه الخاص بالتطبيق
  flutter_launcher_icons: ^0.14.4 #التحكم فى ايقونه التطبيق

flutter:
  # Material Icons font is
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/json/holidays_test.json
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-Black.ttf
          weight: 900

flutter_native_splash:
  color: "#F8F9FA" # لون الخلفية للوضع النهاري (Light Background)
  color_dark: "#121212" # لون الخلفية للوضع الليلي (Dark Background)
  
  android_12:
    color: "#F8F9FA"
    color_dark: "#121212"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#008080" # لون خلفية الأيقونة (يمكنك تغييره للونك المفضل)
  adaptive_icon_foreground: "assets/icons/app_icon.png"
